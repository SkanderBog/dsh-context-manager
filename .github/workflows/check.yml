name: Check plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          DSH_CONTEXT_PLUGIN_ENTRY: ../lib/index.mjs
      - run: npm run test:package
      - run: git diff --exit-code -- lib/index.mjs
