name: Check plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.1
          - os: macos-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: windows-latest
            node: 24
            harness: 0.2.0-rc.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test against the alternate Harness version
        if: matrix.harness != '0.2.0-rc.2'
        shell: bash
        env:
          HARNESS_TEST_VERSION: ${{ matrix.harness }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { devDependencies } = JSON.parse(readFileSync('package.json', 'utf8'))
          const packages = Object.keys(devDependencies).filter(name => name.startsWith('@deepseek-ai/dsh-'))
          execFileSync('npm', ['install', '--no-save', '--package-lock=false', '--ignore-scripts', '--no-audit', '--no-fund', '@deepseek-ai/cordis@4.0.5-alpha.1', ...packages.map(name => `${name}@${process.env.HARNESS_TEST_VERSION}`)], { stdio: 'inherit' })
          JS
      - run: npm run check
        env:
          DSH_CONTEXT_PLUGIN_ENTRY: ../lib/index.mjs
      - run: npm run test:package
      - run: git diff --exit-code -- lib/index.mjs
