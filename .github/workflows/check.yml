name: Check plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.1
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.2
          - os: macos-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: windows-latest
            node: 24
            harness: 0.2.0-rc.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test against the alternate Harness version
        if: matrix.harness != '0.2.0-rc.2'
        shell: bash
        env:
          HARNESS_TEST_VERSION: ${{ matrix.harness }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const original = readFileSync('package.json', 'utf8')
          const manifest = JSON.parse(original)
          delete manifest.devDependencies['@deepseek-ai/dsh-invariants']
          for (const name of Object.keys(manifest.devDependencies)) {
            if (name.startsWith('@deepseek-ai/dsh-')) manifest.devDependencies[name] = process.env.HARNESS_TEST_VERSION
          }
          manifest.devDependencies['@deepseek-ai/cordis'] = '4.0.5-alpha.1'
          try {
            writeFileSync('package.json', JSON.stringify(manifest))
            execFileSync('npm', ['install', '--package-lock=false', '--ignore-scripts', '--no-audit', '--no-fund'], { stdio: 'inherit' })
          } finally { writeFileSync('package.json', original) }
          JS
      - run: npm run check
        env:
          DSH_CONTEXT_PLUGIN_ENTRY: ../lib/index.mjs
      - run: npm run test:package
      - run: git diff --exit-code -- lib/index.mjs
